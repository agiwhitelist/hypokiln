<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="HypoKiln logo">
  <!-- Dark-mode variant: high contrast against #0d1117 / black / ink backgrounds.
       Word "Hypo" becomes paper-cream so it stays visible.
       Icon tile stays cream so the kiln silhouette reads. -->
  <g transform="translate(8 12)">
    <rect width="96" height="96" rx="16" fill="#F6EFE3"/>
    <path d="M28 16 c2 -6 6 -6 8 0 s6 6 8 0" stroke="#E07B2C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M52 16 c2 -6 6 -6 8 0 s6 6 8 0" stroke="#E07B2C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M16 78 V52 a32 32 0 0 1 64 0 V78 Z" fill="#2A1F18"/>
    <path d="M30 78 V62 a18 18 0 0 1 36 0 V78 Z" fill="#F6EFE3"/>
    <path d="M48 76 c-5 -2 -8 -7 -7 -12 c0 -3 2 -5 3 -8 c1 4 2 4 4 6 c0 -4 1 -7 2 -10 c4 4 8 8 8 14 c0 5 -3 9 -8 10 Z" fill="#FF8A3D"/>
    <path d="M48 73 c-2 -1 -4 -3 -3 -6 c2 -1 3 -3 3 -5 c2 3 4 5 4 8 c0 2 -2 4 -4 3 Z" fill="#FFD49A"/>
    <rect x="12" y="78" width="72" height="6" rx="2" fill="#2A1F18"/>
  </g>

  <g transform="translate(120 78)" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-style="italic" font-size="60" font-weight="600">
    <text x="0" y="0" fill="#F6EFE3">Hypo</text>
    <text x="146" y="0" fill="#FF8A3D">Kiln</text>
  </g>

  <g transform="translate(122 102)" font-family="'Instrument Sans', system-ui, sans-serif" font-size="11" letter-spacing="2">
    <text fill="#B8A88F">CAPABILITY · WEDGE · IDEAS</text>
  </g>
</svg>
