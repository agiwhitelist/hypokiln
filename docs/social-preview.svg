<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="HypoKiln social preview">
  <defs>
    <radialGradient id="bgGlow" cx="22%" cy="28%" r="65%">
      <stop offset="0%"  stop-color="#2A1F18" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#16110D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0805" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFD49A"/>
      <stop offset="60%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#E07B2C"/>
    </linearGradient>

    <filter id="emberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bgGlow)"/>

  <!-- subtle grid texture -->
  <g stroke="#3a2b20" stroke-width="0.5" opacity="0.18">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <!-- top-right corner stamp -->
  <g transform="translate(1130 60)" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" font-size="14" letter-spacing="3" fill="#8a7a64">
    <text text-anchor="end">v0.1.0 · MIT</text>
  </g>

  <!-- logo mark (scaled 2.4x) -->
  <g transform="translate(80 138) scale(2.4)">
    <rect width="96" height="96" rx="16" fill="#F6EFE3"/>
    <path d="M28 16 c2 -6 6 -6 8 0 s6 6 8 0" stroke="#E07B2C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M52 16 c2 -6 6 -6 8 0 s6 6 8 0" stroke="#E07B2C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M16 78 V52 a32 32 0 0 1 64 0 V78 Z" fill="#2A1F18"/>
    <path d="M30 78 V62 a18 18 0 0 1 36 0 V78 Z" fill="#F6EFE3"/>
    <g filter="url(#emberGlow)">
      <path d="M48 76 c-5 -2 -8 -7 -7 -12 c0 -3 2 -5 3 -8 c1 4 2 4 4 6 c0 -4 1 -7 2 -10 c4 4 8 8 8 14 c0 5 -3 9 -8 10 Z" fill="url(#ember)"/>
      <path d="M48 73 c-2 -1 -4 -3 -3 -6 c2 -1 3 -3 3 -5 c2 3 4 5 4 8 c0 2 -2 4 -4 3 Z" fill="#FFD49A"/>
    </g>
    <rect x="12" y="78" width="72" height="6" rx="2" fill="#2A1F18"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(420 285)" font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" font-style="italic" font-size="148" font-weight="600">
    <text fill="#F6EFE3">Hypo</text>
    <text x="358" fill="url(#ember)">Kiln</text>
  </g>

  <!-- micro-tagline above title -->
  <g transform="translate(422 162)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" letter-spacing="6" fill="#B8A88F">
    <text>CAPABILITY · WEDGE · IDEAS</text>
  </g>

  <!-- main tagline -->
  <g transform="translate(420 355)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="400" fill="#E6DCC8">
    <text>The idea kiln.</text>
  </g>

  <!-- value prop, two lines -->
  <g transform="translate(420 415)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="300" fill="#9c8e7a">
    <text>Type a paragraph. Six stages later, three validated micro-SaaS</text>
    <text y="32">hypotheses that survived a hard kill filter and a Market Skeptic.</text>
  </g>

  <!-- bottom rail -->
  <g transform="translate(80 562)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#3a2b20" stroke-width="1"/>
  </g>

  <!-- bottom row: install + repo -->
  <g transform="translate(80 600)" font-family="'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace" font-size="18" fill="#9c8e7a">
    <text>$ curl -fsSL hypokiln.sh | bash</text>
  </g>
  <g transform="translate(1200 600)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#FF8A3D" text-anchor="end">
    <text>github.com/agiwhitelist/hypokiln</text>
  </g>
</svg>
