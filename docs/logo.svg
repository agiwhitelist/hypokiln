<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="HypoKiln logo">
  <!-- Kiln icon: a dome with a flame inside, three heat lines on top.
       The icon sits in the warm cream square; flame is the OKLCH amber accent. -->
  <g transform="translate(8 12)">
    <rect width="96" height="96" rx="16" fill="oklch(96% 0.02 80)"/>
    <!-- heat shimmer lines -->
    <path d="M28 16 c2 -6 6 -6 8 0 s6 6 8 0" stroke="oklch(60% 0.18 50)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M52 16 c2 -6 6 -6 8 0 s6 6 8 0" stroke="oklch(60% 0.18 50)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- kiln dome (arch) -->
    <path d="M16 78 V52 a32 32 0 0 1 64 0 V78 Z" fill="oklch(28% 0.04 40)"/>
    <!-- mouth / opening -->
    <path d="M30 78 V62 a18 18 0 0 1 36 0 V78 Z" fill="oklch(96% 0.02 80)"/>
    <!-- flame inside the mouth -->
    <path d="M48 76
             c-5 -2 -8 -7 -7 -12
             c0 -3 2 -5 3 -8
             c1 4 2 4 4 6
             c0 -4 1 -7 2 -10
             c4 4 8 8 8 14
             c0 5 -3 9 -8 10 Z"
          fill="oklch(70% 0.22 55)"/>
    <!-- flame inner highlight -->
    <path d="M48 73 c-2 -1 -4 -3 -3 -6 c2 -1 3 -3 3 -5 c2 3 4 5 4 8 c0 2 -2 4 -4 3 Z"
          fill="oklch(88% 0.18 80)"/>
    <!-- base shadow -->
    <rect x="12" y="78" width="72" height="6" rx="2" fill="oklch(28% 0.04 40)"/>
  </g>

  <!-- Wordmark: HypoKiln in editorial Cormorant-style serif.
       "Hypo" in deep ink, "Kiln" in amber accent. -->
  <g transform="translate(120 78)" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-style="italic" font-size="60" font-weight="600">
    <text x="0" y="0" fill="oklch(20% 0.02 40)">Hypo</text>
    <text x="146" y="0" fill="oklch(60% 0.18 50)">Kiln</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(122 102)" font-family="'Instrument Sans', system-ui, sans-serif" font-size="11" letter-spacing="2">
    <text fill="oklch(40% 0.02 40)">CAPABILITY · WEDGE · IDEAS</text>
  </g>
</svg>
