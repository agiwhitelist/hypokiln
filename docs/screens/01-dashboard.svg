<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-label="HypoKiln dashboard">
  <defs>
    <style>
      .paper { fill: #FBF5EA; }
      .card { fill: #F6EFE3; stroke: #E5D9C0; stroke-width: 1; }
      .ink { fill: #1F1611; }
      .charcoal { fill: #3D2E22; }
      .ash { fill: #897560; }
      .amber { fill: #C4651D; }
      .amber-pale { fill: #E5C68B; }
      .mist { fill: #E5D9C0; }
      .success { fill: #5C8C4E; }
      .danger { fill: #C8543E; }
      .warning { fill: #C99543; }
      .display { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }
      .body { font-family: 'Instrument Sans', system-ui, sans-serif; }
      .mono { font-family: 'Space Grotesk', monospace; }
      .micro { font-family: 'Instrument Sans', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" class="paper"/>

  <!-- Top nav bar -->
  <rect x="0" y="0" width="1100" height="64" fill="#FBF5EA" stroke="#E5D9C0"/>

  <!-- Logo mark in header -->
  <g transform="translate(40 18)">
    <rect width="28" height="28" rx="6" fill="#F6EFE3"/>
    <path d="M6 22 V15 a8 8 0 0 1 16 0 V22 Z" fill="#2A1F18"/>
    <path d="M9 22 V18 a5 5 0 0 1 10 0 V22 Z" fill="#F6EFE3"/>
    <path d="M14 21 c-2 -1 -2 -3 -2 -4 c0 -1 1 -2 1 -3 c1 1 1 1 2 2 c0 -1 0 -2 1 -3 c2 2 3 3 3 5 c0 1 -1 3 -3 3 Z" fill="#E07B2C"/>
  </g>
  <text x="76" y="38" class="display ink" font-size="20" font-weight="500">Hypo<tspan fill="#C4651D">Kiln</tspan></text>

  <!-- Nav links -->
  <g class="body" font-size="13" fill="#3D2E22">
    <text x="720" y="38">Ideas</text>
    <text x="770" y="38" fill="#C4651D" font-weight="500">Wedges</text>
    <text x="835" y="38">Portfolio</text>
    <text x="908" y="38">Stats</text>
    <text x="952" y="38">Templates</text>
    <text x="1023" y="38">Search</text>
  </g>
  <rect x="1058" y="20" width="24" height="24" rx="4" fill="#1F1611"/>
  <text x="1063" y="36" class="body" font-size="11" fill="#FBF5EA" font-weight="500">+</text>

  <!-- Hero section -->
  <text x="40" y="118" class="micro amber">CAPABILITY · WEDGE · IDEAS</text>
  <text x="40" y="178" class="display ink" font-size="56" font-weight="300">The idea kiln.</text>
  <text x="40" y="220" class="body charcoal" font-size="15">Six stages from frontier-AI signals to a ranked top-3 of validated micro-SaaS hypotheses,</text>
  <text x="40" y="240" class="body charcoal" font-size="15">with a built-in Market Skeptic that kills weak ideas before you spend a token building.</text>

  <!-- CTAs -->
  <g transform="translate(40 268)">
    <rect width="170" height="42" rx="6" fill="#1F1611"/>
    <text x="32" y="27" class="body" font-size="14" fill="#FBF5EA">Start a new idea</text>
    <rect x="184" width="220" height="42" rx="6" fill="none" stroke="#E5D9C0" stroke-width="1"/>
    <text x="200" y="27" class="body charcoal" font-size="14">Browse active wedges →</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="350" x2="1060" y2="350" stroke="#E5D9C0"/>

  <!-- Recent ideas heading -->
  <text x="40" y="388" class="display ink" font-size="22" font-weight="500">Recent ideas <tspan class="body ash" font-size="13">(4)</tspan></text>

  <!-- Idea card 1: ssl-renewal-alarm (completed + signed) -->
  <g transform="translate(40 410)">
    <rect width="1020" height="64" rx="6" class="card"/>
    <text x="16" y="22" class="mono charcoal" font-size="13">ssl-renewal-alarm</text>
    <text x="180" y="22" class="micro amber">AUTO</text>
    <text x="220" y="22" class="micro success">G1 SIGNED</text>
    <text x="16" y="44" class="body ink" font-size="13">Build me a $3/mo SSL renewal alarm for solo devs running side-project domains</text>
    <text x="880" y="22" class="body charcoal" font-size="12" text-anchor="end">6/6 stages</text>
    <text x="880" y="40" class="micro ash" text-anchor="end">2 DAYS AGO</text>
    <!-- progress -->
    <g transform="translate(16 52)">
      <rect width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="164" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="328" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="492" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="656" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="820" width="160" height="4" rx="2" fill="#C4651D"/>
    </g>
  </g>

  <!-- Idea card 2: stripe-burn-bot (waiting on G1) -->
  <g transform="translate(40 484)">
    <rect width="1020" height="64" rx="6" class="card" stroke="#C99543" stroke-width="1.5"/>
    <text x="16" y="22" class="mono charcoal" font-size="13">stripe-burn-bot</text>
    <text x="160" y="22" class="micro warning">WAITING ON G1</text>
    <text x="16" y="44" class="body ink" font-size="13">A $9/mo Slack-bot that scans solo founders' Stripe + GitHub once a day and posts burn / runway</text>
    <text x="880" y="22" class="body charcoal" font-size="12" text-anchor="end">6/6 stages</text>
    <text x="880" y="40" class="micro ash" text-anchor="end">6 HOURS AGO</text>
    <g transform="translate(16 52)">
      <rect width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="164" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="328" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="492" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="656" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="820" width="160" height="4" rx="2" fill="#C4651D"/>
    </g>
  </g>

  <!-- Idea card 3: ai-changelog (Stage 4 in progress) -->
  <g transform="translate(40 558)">
    <rect width="1020" height="64" rx="6" class="card"/>
    <text x="16" y="22" class="mono charcoal" font-size="13">ai-changelog</text>
    <text x="142" y="22" class="micro amber">AUTO</text>
    <text x="180" y="22" class="micro" fill="#897560">STAGE 4: KILL FILTER</text>
    <text x="16" y="44" class="body ink" font-size="13">AI-generated changelogs from commit messages for solo OSS maintainers at $5/mo</text>
    <text x="880" y="22" class="body charcoal" font-size="12" text-anchor="end">3/6 stages</text>
    <text x="880" y="40" class="micro ash" text-anchor="end">RUNNING</text>
    <g transform="translate(16 52)">
      <rect width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="164" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="328" width="160" height="4" rx="2" fill="#C4651D"/>
      <rect x="492" width="160" height="4" rx="2" fill="#E5C68B"/>
      <rect x="656" width="160" height="4" rx="2" fill="#E5D9C0"/>
      <rect x="820" width="160" height="4" rx="2" fill="#E5D9C0"/>
    </g>
  </g>

  <!-- Idea card 4: voice-meeting-summary (early stage) -->
  <g transform="translate(40 632)">
    <rect width="1020" height="48" rx="6" class="card"/>
    <text x="16" y="20" class="mono charcoal" font-size="13">voice-meeting-summary</text>
    <text x="206" y="20" class="micro" fill="#897560">STAGE 1: TREND RADAR</text>
    <text x="16" y="38" class="body ink" font-size="12">Real-time voice transcript + decision extraction for async standups, $12/mo per team</text>
    <text x="880" y="20" class="body charcoal" font-size="12" text-anchor="end">0/6 stages</text>
  </g>
</svg>
